# fail2ban Configuration Template
# Applied by scripts/02-security.sh

[DEFAULT]
# Ban duration in seconds (3600 = 1 hour, 86400 = 1 day)
bantime = 3600

# Time window for counting failures (600 = 10 minutes)
findtime = 600

# Number of failures before ban
maxretry = 5

# Email notifications (optional)
destemail = root@localhost
sendername = Fail2Ban

# Actions (ban + optionally send email)
action = %(action_)s

[sshd]
enabled = true
port = ssh
logpath = %(sshd_log)s
backend = %(sshd_backend)s
maxretry = 3
bantime = 86400

# Additional jails (uncomment as needed)

